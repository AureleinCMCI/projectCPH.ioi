<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="620" viewBox="0 0 1380 620" margin="48px">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#071024"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-size: 40px; font-weight:700; }
      .subtitle { fill: #cbd5e1; font-family: Inter, Arial, sans-serif; font-size: 18px; }
      .heading { fill: #e6f0ff; font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight:700; }
      .text { fill: #cbd5e1; font-family: Inter, Arial, sans-serif; font-size: 16px; }
      .pill { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.06); stroke-width:1; rx:10; }
      .icon { font-size: 28px; }
      .footer { fill: #94a3b8; font-family: Inter, Arial, sans-serif; font-size: 13px; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Header -->
  <g transform="translate(48,36)">
    <text x="0" y="0" class="title">Architecture &amp; process — Upload d'images (miniatures)</text>
    <text x="0" y="44" class="subtitle">Résumé technique : flux sécurisé, compression client, stockage service-role, affichage de miniatures</text>
  </g>

  <!-- Three columns container -->
  <g transform="translate(48,120)">
    <!-- Column 1: Architecture -->
    <rect x="0" y="0" width="380" height="420" class="pill"/>
    <text x="20" y="36" class="heading">Architecture</text>
    <text x="20" y="72" class="text">• Frontend : Next.js (App Router) + React</text>
    <text x="20" y="100" class="text">• Stockage &amp; BD : Supabase (Postgres + Storage)</text>
    <text x="20" y="128" class="text">• Auth : JWT custom (stocké localStorage)</text>
    <text x="20" y="156" class="text">• Upload sécurisé : Service Role côté serveur</text>

    <g transform="translate(20,190)">
      <text class="heading" x="0" y="0">Libs clés</text>
      <text class="text" x="0" y="28">• html5-qrcode / QuaggaJS (scanner)</text>
      <text class="text" x="0" y="52">• Web APIs (getUserMedia, BarcodeDetector)</text>
      <text class="text" x="0" y="76">• Compression client → WebP (lib interne)</text>
    </g>
  </g>

  <g transform="translate(460,120)">
    <!-- Column 2: Upload Flow -->
    <rect x="0" y="0" width="380" height="420" padding="120px" class="pill"/>
    <text x="20" y="36" class="heading">Flux d'upload</text>

    <!-- Steps with icons -->
    <g transform="translate(20,72)">
      <text class="icon" x="0" y="0">📱</text>
      <text class="text" x="40" y="4">1) Capture photo depuis modal scanner</text>

      <text class="icon" x="0" y="44">🗜️</text>
      <text class="text" x="40" y="48">2) Compression client → main + thumbnail (WebP)</text>

      <text class="icon" x="0" y="88">🔒</text>
      <text class="text" x="40" y="92">3) POST FormData → /api/uploadImageAndThumb (server)</text>

      <text class="icon" x="0" y="132">🗄️</text>
      <text class="text" x="40" y="136">4) Serveur (Service Role) écrit dans bucket 'image' &amp; renvoie URLs</text>

      <text class="icon" x="0" y="176">📝</text>
      <text class="text" x="40" y="180">5) Frontend enregistre imageUrl &amp; thumbUrl en DB (POST/PATCH /api/livre)</text>

      <text class="icon" x="0" y="220">🖼️</text>
      <text class="text" x="40" y="224">6) APIs retournent livre(id,image,thumb) → UI affiche miniature</text>
    </g>
  </g>

  <g transform="translate(872,120)">
    <!-- Column 3: Résultats &amp; actions -->
    <rect x="0" y="0" margin-left="190px" width="560" height="420" class="pill"/>
    <text x="20" y="36" class="heading">Résultats &amp; points d'attention</text>

    <text x="20" y="72" class="text">• Uploads réussis → fichiers visibles en Storage</text>
    <text x="20" y="100" class="text">• Cause fréquente d'erreur : SELECTs API omettant <tspan font-weight="700">thumb</tspan></text>
    <text x="20" y="128" class="text">• Autre source : mismatch champs renvoyés (imageUrl / thumbUrl) vs attendu</text>

    <g transform="translate(20,170)">
      <text class="heading" x="0" y="0">Actions recommandées</text>
      <text class="text" x="0" y="28">1) Auditer toutes les routes qui sélectionnent `livre` et ajouter `thumb`</text>
      <text class="text" x="0" y="56">2) Normaliser forme de réponse: toujours { imageUrl, thumbUrl }</text>
      <text class="text" x="0" y="84">3) Ajouter logs &amp; loaders côté client lors de l'upload</text>
      <text class="text" x="0" y="112">4) Optionnel: compression finale côté serveur (sharp) si besoin</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(48,560)">
    <rect x="0" y="0" width="1184" height="96" rx="8" fill="rgba(255,255,255,0.02)"/>
    <text x="16" y="30" class="footer">Projet: projectCPH.ioi • Endpoint important: /api/uploadImageAndThumb • Bucket: image</text>
    <text x="16" y="58" class="footer">Généré: 2025-11-03 • Résumé: compression client → upload serveur (Service Role) → stocker URLs → API must return thumb</text>
  </g>
</svg>